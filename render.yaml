services:
  - type: web
    name: bridge-youth
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: YOUTH_POLICY_API_KEY
        sync: false
      - key: ADMIN_MAINTENANCE_TOKEN
        generateValue: true
      - key: EVENT_RETENTION_DAYS
        value: "90"

